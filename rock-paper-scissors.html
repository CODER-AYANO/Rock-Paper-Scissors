<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#000000" />
		<title>Rock Paper Scissors</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="head">
			<h1>Rock Paper Scissors</h1>
		</div>
		<div class="game">
			<div class="cards">
				<div class="rock card">
					<img class="images" src="images/stone.webp" alt="rock" />
					<p>ROCK</p>
				</div>
				<div class="paper card">
					<img class="images" src="images/paper.webp" alt="paper" />
					<p>PAPER</p>
				</div>
				<div class="scissors card">
					<img class="images" src="images/scissor.webp" alt="scissors" />
					<p>SCISSORS</p>
				</div>
			</div>
			<div class="container"></div>
			<div class="score">
				<div class="player players">
					<img class="photo" src="images/player.webp" />
					<p>
						Your <br />
						Score <br />0
					</p>
				</div>
				<div class="computer players">
					<p>
						Villager <br />
						Score <br />
						0
					</p>
					<img class="photo" src="images/villager.webp" />
				</div>
			</div>
			<button class="reset">Reset</button>
		</div>
		<script src="script.js"></script>
	</body>
</html>
